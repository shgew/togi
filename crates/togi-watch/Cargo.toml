[package]
name = "togi-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The togi watch dashboard: the incremental journal model, history, words and the frame seam"

[dependencies]
jiff.workspace = true
nix = { workspace = true, features = ["signal"] }
ratatui = { workspace = true, features = ["crossterm"] }
rustix = { workspace = true, features = ["event", "fs", "pipe", "termios"] }
thiserror.workspace = true
togi-journal.workspace = true
togi-machine.workspace = true
togi-render.workspace = true
togi-tuner.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
nix = { workspace = true, features = ["signal"] }
rustix = { workspace = true, features = ["event", "fs", "process", "pty", "termios"] }
serde_json.workspace = true
tempfile.workspace = true
togi-config.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
