version: "2"
run:
  build-tags: [integration]
linters:
  default: standard
  enable: [exhaustive, misspell, unconvert, nolintlint, errorlint, gocritic, modernize, usetesting, thelper, gocognit]
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    gocognit:
      min-complexity: 50
  exclusions:
    warn-unused: true
    presets: [std-error-handling]
    rules:
      - path: '_test\.go$'
        linters: [gocognit]
formatters:
  enable: [gofmt]
