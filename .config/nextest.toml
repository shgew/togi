[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false
# Exhaustive recovery campaigns run in the dedicated CI-tier check, not the local loop.
default-filter = '''
not (
  (package(togi-session) & (
    test(=whole::cut::killing_the_scenario_after_every_durable_event_resumes_to_the_same_projection_and_commitments)
    | test(=whole::cut::crashes_at_every_durable_event_and_smu_access_account_for_trials_and_preserve_decisions)
  ))
  | (package(togi-simrun) & test(/^warm_cold::warm_equals_cold::/))
)
'''

[test-groups.hardware]
max-threads = 1

# Match real-process tests at any module depth, including togi's commands binary.
[[profile.default.overrides]]
filter = "test(/(^|::)real_process_/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = "package(togi-session) & test(/^whole::cut::/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = "package(togi-smu) & binary(hardware)"
test-group = "hardware"

[profile.ci]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false
retries = 0
failure-output = "immediate-final"
status-level = "pass"

[[profile.ci.overrides]]
filter = "test(/(^|::)real_process_/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = "package(togi-session) & test(/^whole::cut::/)"
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = "(package(togi-tuner) & binary(policy)) | (package(togi-tool-bench) & test(/^metrics::snapshot_tests::/))"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = "package(togi-smu) & binary(hardware)"
test-group = "hardware"
