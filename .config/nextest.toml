[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

[test-groups.real-process]
max-threads = 2

[test-groups.hardware]
max-threads = 1

[[profile.default.overrides]]
filter = "test(/(^|::)real_process_/)"
test-group = "real-process"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = "package(togi-smu) & binary(hardware)"
test-group = "hardware"

[profile.ci]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false
retries = 0
failure-output = "immediate-final"
status-level = "slow"

[[profile.ci.overrides]]
filter = "test(/(^|::)real_process_/)"
test-group = "real-process"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = "package(togi-smu) & binary(hardware)"
test-group = "hardware"
