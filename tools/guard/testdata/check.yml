name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NIX_CONFIG: accept-flake-config = false

jobs:
  eval:
    runs-on: ubuntu-26.04
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    strategy:
      matrix:
        check: ${{ fromJSON(needs.eval.outputs.checks) }}
    runs-on: ubuntu-26.04
    steps:
      - run: nix build ".#checks.x86_64-linux.$CHECK"

  macos:
    if: github.event_name == 'push'
    runs-on: macos-26
    steps:
      - run: nix build ".#checks.aarch64-darwin.package"

  check:
    if: always()
    needs: [build]
    runs-on: ubuntu-26.04
    steps:
      - run: test "$BUILD" = success
