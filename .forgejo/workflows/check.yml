name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: nix-latest
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        system-features = nixos-test benchmark big-parallel kvm
    steps:
      - name: Check out
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraHeader="Authorization: Basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)" fetch -q origin "${{ github.sha }}"
          git checkout -q --detach FETCH_HEAD
      - name: Give build users KVM
        run: chmod 0666 /dev/kvm
      - name: just check
        run: nix develop --command just check
      - name: just vuln
        run: nix develop --command just vuln

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: nix-latest
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
    steps:
      - name: Check out
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraHeader="Authorization: Basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)" fetch -q origin "${{ github.sha }}"
          git checkout -q --detach FETCH_HEAD
      - name: Publish a merged release
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command go run ./tools/release -publish
