version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-toolchain:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  # Flake inputs are git revisions, not SemVer, so this group has no
  # update-types: the updater only groups versions it can classify.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    groups:
      nix:
        patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
