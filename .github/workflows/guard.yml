# Protects the comparison assets listed in tools/guard/manifest.sha256 (docs/porting.md). The workflow runs from
# the base branch, so a pull request cannot edit the guard that judges it. The verdict is the `guard` commit
# status on the head, written by three jobs:
# - `start` posts `pending` before anything can fail, so an earlier success never stays authoritative.
# - `evaluate` holds no write permission (contents and pull-requests read only). It checks out the base, fetches
#   the head as data, reads the pull request's current labels, and runs the base's guard on the tree that merging
#   the head into the base produces. No head code runs; the only evaluation of the head is `nix eval` of its
#   flake's check names with import-from-derivation disabled.
# - `report` turns the guard's exit code and summary line into the final `guard` status.
# Edits that do not change the base (title, body) skip every job and post nothing.
name: guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    branches: [main]

permissions: {}

concurrency:
  # Skipped edits get a group of their own so they never cancel a run in progress.
  group: guard-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-skip-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  start:
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - name: Post the pending guard status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context=guard \
            -f description='the guard is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  evaluate:
    needs: start
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.guard.outputs.code }}
      summary: ${{ steps.guard.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Fetch the head as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - name: Read the current labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')
          approved=false
          if printf '%s\n' "$labels" | grep -qxF owner-approved; then approved=true; fi
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
      - name: Run the base's guard
        id: guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED: ${{ steps.labels.outputs.approved }}
        run: |
          flags=()
          if [ "$APPROVED" = true ]; then flags+=(--approved); fi
          set +e
          nix shell --inputs-from . nixpkgs#nushell --command nu --no-config-file tools/guard/guard.nu "$BASE_SHA" "$HEAD_SHA" "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/guard.log"
          code=${PIPESTATUS[0]}
          set -e
          summary=$(grep -E '^(owner-approved: |[0-9]+ protected changes|no protected asset changed)' "$RUNNER_TEMP/guard.log" | tail -n 1 | tr -d '\r\n' | cut -c1-140 || true)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  report:
    needs: [start, evaluate]
    if: ${{ !cancelled() && needs.start.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - name: Post the guard status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.evaluate.result }}
          CODE: ${{ needs.evaluate.outputs.code }}
          SUMMARY: ${{ needs.evaluate.outputs.summary }}
        run: |
          state=failure
          if [ "$RESULT" = success ] && [ "$CODE" = 0 ]; then state=success; fi
          description=$SUMMARY
          if [ -z "$description" ]; then description='the guard could not run; see the workflow run'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=guard \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$state" != success ]; then exit 1; fi
