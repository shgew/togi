# CI's definition of green: every Linux flake check on GitHub-hosted runners, one job per check so the VM
# tests boot in parallel. No job runs on macOS (ADR 0061): `just lint` and `just gate` clippy the Rust
# workspace for aarch64-apple-darwin from Linux, and a breakage found on a Mac is fixed as a bug. The
# aggregating `check` job requires the Linux checks. Jobs substitute from the public Cachix cache `togi`
# and push each check's output when CACHIX_AUTH_TOKEN is available, so a check whose inputs are unchanged
# passes without running; the checks build the package with the revision `dev` so that a new commit alone
# changes none of them (ADR 0021).
# The release workflow builds the default package and runs nextest on the release commit.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    runs-on: ubuntu-26.04
    outputs:
      checks: ${{ steps.list.outputs.checks }}
      vm-checks: ${{ steps.list.outputs.vm-checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: nix flake check --no-build
        run: nix flake check --no-build
      - id: list
        name: List the checks
        run: |
          echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"
          echo "vm-checks=$(nix eval --json .#checks.x86_64-linux --apply 'checks: builtins.filter (name: checks.${name} ? driver) (builtins.attrNames checks)')" >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.eval.outputs.checks) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Give build users KVM
        if: contains(fromJSON(needs.eval.outputs.vm-checks), matrix.check)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: togi
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: nix build .#checks.x86_64-linux.${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
        run: nix build --no-link --print-build-logs --print-out-paths ".#checks.x86_64-linux.$CHECK" > "$RUNNER_TEMP/out-paths"
      - name: Push the check's output to Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        continue-on-error: true
        run: cachix push togi < "$RUNNER_TEMP/out-paths"


  check:
    if: always()
    needs: [eval, build]
    runs-on: ubuntu-26.04
    steps:
      - name: Every check passed
        env:
          BUILD: ${{ needs.build.result }}
        run: test "$BUILD" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Every simulator suite shard was built
        env:
          CHECKS: ${{ needs.eval.outputs.checks }}
        run: |
          want=$(jq -ce '.shards as $n | select($n >= 1) | [range($n) | "sim-suite-\(.)"]' nix/sim-suite.json)
          got=$(jq -c '[.[] | select(startswith("sim-suite-"))] | sort_by(ltrimstr("sim-suite-") | tonumber)' <<<"$CHECKS")
          test "$got" = "$want" || { echo "suite shards built: $got; nix/sim-suite.json expects: $want"; exit 1; }
