name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  eval:
    runs-on: ubuntu-26.04
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: nix flake check --no-build
        run: nix flake check --no-build
      - id: list
        name: List the checks
        run: echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.eval.outputs.checks) }}
    runs-on: ubuntu-26.04
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Give build users KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: togi
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: nix build .#checks.x86_64-linux.${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
        run: nix build --no-link --print-build-logs --print-out-paths ".#checks.x86_64-linux.$CHECK" > "$RUNNER_TEMP/out-paths"
      - name: Push the check's output to Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        continue-on-error: true
        run: cachix push togi < "$RUNNER_TEMP/out-paths"

  macos:
    name: macOS arm64
    runs-on: macos-26
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: togi
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: nix build every aarch64-darwin check
        run: |
          list=$(nix eval --raw .#checks.aarch64-darwin --apply 'checks: toString (map (name: ".#checks.aarch64-darwin.${name}") (builtins.attrNames checks))')
          read -ra checks <<< "$list"
          nix build --no-link --print-build-logs --print-out-paths "${checks[@]}" > "$RUNNER_TEMP/out-paths"
      - name: Push the checks' outputs to Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        continue-on-error: true
        run: cachix push togi < "$RUNNER_TEMP/out-paths"

  check:
    if: always()
    needs: [build, macos]
    runs-on: ubuntu-26.04
    steps:
      - name: Every check passed
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.macos.result }}" = success
