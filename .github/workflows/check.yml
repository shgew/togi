# Every flake check runs, on pull requests and on workflow_dispatch alike, unless the public Cachix cache `togi`
# already holds its output, which the owner's gate publishes for what it built (ADR 0085, ADR 0074). A pull request
# builds the cheap checks named in the eval step together in one light job and every other uncached check, such as
# clippy, doc, each `nextest-<group>`, the simulator shards and the VM tests, in a job of its own so the VM tests
# boot in parallel (ADR 0075). The release dispatches and waits for a run on the exact main head before making its
# release commit; a check that run finds cached counts as passed.
# No job runs on macOS (ADR 0061): `just lint` and `just gate` clippy the Rust workspace for
# aarch64-apple-darwin from Linux, and a breakage found on a Mac is fixed as a bug.
# eval skips outputs already in the public Cachix cache `togi`; build jobs substitute from it and push
# their outputs when CACHIX_AUTH_TOKEN is available. The aggregate `check` accepts cached or successful
# builds, even when all outputs were cached. Checks build the package with revision `dev` so that a new
# commit alone changes none of them (ADR 0021).
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only pull request runs may cancel an earlier run; a release can be waiting on a dispatch.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    runs-on: ubuntu-26.04
    outputs:
      checks: ${{ steps.list.outputs.checks }}
      light: ${{ steps.list.outputs.light }}
      vm-checks: ${{ steps.list.outputs.vm-checks }}
      all-checks: ${{ steps.list.outputs.all-checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: nix flake check --no-build
        run: nix flake check --no-build
      - id: list
        name: Select checks missing from Cachix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          info=$(nix eval --json .#checks.x86_64-linux --apply '
            checks: let all = builtins.attrNames checks; in {
              all-checks = all;
              vm-checks = builtins.filter (name: checks.${name} ? driver) all;
              selected = map (name: { inherit name; out = checks.${name}.outPath; }) all;
            }')
          jq -e '.selected | length > 0' <<< "$info" > /dev/null
          rows=$(jq -er '.selected[] | [.name, .out] | @tsv' <<< "$info")
          matrix_checks=()
          light_checks=()
          printf '%-24s %s\n' 'Selected check' 'Cached'
          while IFS=$'\t' read -r name out_path; do
            store_name=${out_path##*/}
            hash=${store_name:0:32}
            if curl -sfI --retry 2 --connect-timeout 5 --max-time 15 "https://togi.cachix.org/$hash.narinfo" > /dev/null; then
              printf '%-24s %s\n' "$name" yes
              continue
            fi
            printf '%-24s %s\n' "$name" no
            if [[ "$EVENT_NAME" == pull_request && " fmt changes deny shear module board-test sql-test doc-links package " == *" $name "* ]]; then
              light_checks+=("$name")
            else
              matrix_checks+=("$name")
            fi
          done <<< "$rows"
          {
            echo "checks=$(jq -cn --args '$ARGS.positional' "${matrix_checks[@]}")"
            echo "light=${light_checks[*]}"
            echo "vm-checks=$(jq -c '."vm-checks"' <<< "$info")"
            echo "all-checks=$(jq -c '."all-checks"' <<< "$info")"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    if: needs.eval.outputs.checks != '' && needs.eval.outputs.checks != '[]'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.eval.outputs.checks) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Give build users KVM
        if: contains(fromJSON(needs.eval.outputs.vm-checks), matrix.check)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: togi
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: nix build .#checks.x86_64-linux.${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
        run: nix build --no-link --print-build-logs --print-out-paths ".#checks.x86_64-linux.$CHECK" > "$RUNNER_TEMP/out-paths"
      - name: Push the check's output to Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        continue-on-error: true
        run: cachix push togi < "$RUNNER_TEMP/out-paths"

  light:
    needs: eval
    if: needs.eval.outputs.light != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: togi
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build the light checks together
        env:
          LIGHT_CHECKS: ${{ needs.eval.outputs.light }}
        run: |
          read -r -a checks <<< "$LIGHT_CHECKS"
          installables=()
          for check in "${checks[@]}"; do
            installables+=(".#checks.x86_64-linux.$check")
          done
          nix build --no-link --print-build-logs --keep-going --print-out-paths "${installables[@]}" > "$RUNNER_TEMP/out-paths"
      - name: Push the checks' outputs to Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        continue-on-error: true
        run: cachix push togi < "$RUNNER_TEMP/out-paths"

  check:
    if: always()
    needs: [eval, build, light]
    runs-on: ubuntu-26.04
    steps:
      - name: Every check passed
        env:
          EVAL: ${{ needs.eval.result }}
          BUILD: ${{ needs.build.result }}
          LIGHT: ${{ needs.light.result }}
        run: |
          printf 'eval=%s build=%s light=%s\n' "$EVAL" "$BUILD" "$LIGHT"
          test "$EVAL" = success
          for result in "$BUILD" "$LIGHT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'workflow_dispatch'
      - name: Every simulator suite shard was built
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKS: ${{ needs.eval.outputs.all-checks }}
        run: |
          want=$(jq -ce '.shards as $n | select($n >= 1) | [range($n) | "sim-suite-\(.)"]' nix/sim-suite.json)
          got=$(jq -c '[.[] | select(startswith("sim-suite-"))] | sort_by(ltrimstr("sim-suite-") | tonumber)' <<<"$CHECKS")
          test "$got" = "$want" || { echo "suite shards built: $got; nix/sim-suite.json expects: $want"; exit 1; }
