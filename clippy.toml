allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# The tripwire inventory of #634 (Boundaries): each approved call site carries
# #[expect(clippy::disallowed_methods, reason = "...")]. An entry lands with the crate that
# defines or first calls its path: process spawning (trial workloads, journalctl in detect,
# systemd-run, systemctl and grub-editenv in hardware, the simulator in bench, bench in
# audit), the SMU seam's write methods and journal writes outside the journal crate.
disallowed-methods = [
    { path = "togi_machine::Smu::set_offset", reason = "Only the session write transaction and zero-only emergency write through the SMU seam" },
    { path = "togi_machine::Smu::set_all_offsets", reason = "Only the session write transaction and zero-only emergency write through the SMU seam" },
]
