[workspace]
members = ["crates/*"]
exclude = ["crates/togi-journal/fuzz"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/shgew/togi"
publish = false

[workspace.dependencies]
flate2 = "1"
getrandom = { version = "0.4", features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
nix = { version = "0.30", default-features = false, features = ["fs"] }
proptest = "1"
rand = { version = "=0.10.3", default-features = false, features = ["std_rng"] }
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
tempfile = "3"
test-case = "3"
thiserror = "2"
togi-backend = { path = "crates/togi-backend", version = "0.0.0" }
togi-command = { path = "crates/togi-command", version = "0.0.0" }
togi-config = { path = "crates/togi-config", version = "0.0.0" }
togi-defect = { path = "crates/togi-defect", version = "0.0.0" }
togi-detect = { path = "crates/togi-detect", version = "0.0.0" }
togi-facts = { path = "crates/togi-facts", version = "0.0.0" }
togi-hostlock = { path = "crates/togi-hostlock", version = "0.0.0" }
togi-journal = { path = "crates/togi-journal", version = "0.0.0" }
togi-machine = { path = "crates/togi-machine", version = "0.0.0" }
togi-mprime = { path = "crates/togi-mprime", version = "0.0.0" }
togi-requests = { path = "crates/togi-requests", version = "0.0.0" }
togi-sim = { path = "crates/togi-sim", version = "0.0.0" }
togi-smu = { path = "crates/togi-smu", version = "0.0.0" }
togi-trial = { path = "crates/togi-trial", version = "0.0.0" }
togi-trialfiles = { path = "crates/togi-trialfiles", version = "0.0.0" }
togi-tuningboot = { path = "crates/togi-tuningboot", version = "0.0.0" }
togi-ycruncher = { path = "crates/togi-ycruncher", version = "0.0.0" }
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# The pedantic allow-list uv and ruff share, from their workspace Cargo.toml files.
assert_is_empty = "allow"
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
if_not_else = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Restriction lints; clippy.toml allows unwrap, expect and dbg in tests.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = "full"
