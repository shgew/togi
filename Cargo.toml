[workspace]
members = ["crates/*"]
exclude = ["crates/togi-journal/fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/shgew/togi"
publish = false

[workspace.dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = { version = "4", default-features = false }
clap_complete_nushell = { version = "4", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
flate2 = "1"
getrandom = { version = "0.4", features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
nix = { version = "0.31", default-features = false, features = ["fs"] }
proptest = "1"
rand = { version = "=0.10.3", default-features = false, features = ["std_rng"] }
ratatui = { version = "0.30", default-features = false, features = ["std"] }
rayon = "1"
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
serde_path_to_error = "0.1"
sha2 = "0.11"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
tempfile = "3"
test-case = "3"
thiserror = "2"
togi-backend = { path = "crates/togi-backend" }
togi-carry = { path = "crates/togi-carry" }
togi-command = { path = "crates/togi-command" }
togi-config = { path = "crates/togi-config" }
togi-defect = { path = "crates/togi-defect" }
togi-detect = { path = "crates/togi-detect" }
togi-facts = { path = "crates/togi-facts" }
togi-hardware = { path = "crates/togi-hardware" }
togi-hostlock = { path = "crates/togi-hostlock" }
togi-journal = { path = "crates/togi-journal" }
togi-machine = { path = "crates/togi-machine" }
togi-mprime = { path = "crates/togi-mprime" }
togi-render = { path = "crates/togi-render" }
togi-requests = { path = "crates/togi-requests" }
togi-session = { path = "crates/togi-session" }
togi-sim = { path = "crates/togi-sim" }
togi-simrun = { path = "crates/togi-simrun" }
togi-smu = { path = "crates/togi-smu" }
togi-statecopy = { path = "crates/togi-statecopy" }
togi-tool-audit = { path = "crates/togi-tool-audit" }
togi-tool-forecast = { path = "crates/togi-tool-forecast" }
togi-tool-modelcheck = { path = "crates/togi-tool-modelcheck" }
togi-tool-trialfacts = { path = "crates/togi-tool-trialfacts" }
togi-trial = { path = "crates/togi-trial" }
togi-trialfiles = { path = "crates/togi-trialfiles" }
togi-tuner = { path = "crates/togi-tuner" }
togi-tuningboot = { path = "crates/togi-tuningboot" }
togi-version = { path = "crates/togi-version" }
togi-watch = { path = "crates/togi-watch" }
togi-watchtest = { path = "crates/togi-watchtest" }
togi-ycruncher = { path = "crates/togi-ycruncher" }
tokio = { version = "1", default-features = false }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# The pedantic allow-list uv and ruff share, from their workspace Cargo.toml files.
assert_is_empty = "allow"
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
if_not_else = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Restriction lints; clippy.toml allows unwrap, expect and dbg in tests.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "deny"
wildcard_enum_match_arm = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Keep the expensive simulator, session and render loops optimized; these measured leaf crates and tools
# need less code-generation work at 0 without a material test-time increase.
# New crates stay at 1 until their compile and test costs are measured (docs/rust-migration.md, #932).
[profile.dev.package]
togi = { opt-level = 0 }
togi-backend = { opt-level = 0 }
togi-command = { opt-level = 0 }
togi-detect = { opt-level = 0 }
togi-hardware = { opt-level = 0 }
togi-hostlock = { opt-level = 0 }
togi-mprime = { opt-level = 0 }
togi-smu = { opt-level = 0 }
togi-tool-audit = { opt-level = 0 }
togi-tool-bench = { opt-level = 0 }
togi-tool-facts = { opt-level = 0 }
togi-tool-fit = { opt-level = 0 }
togi-tool-forecast = { opt-level = 0 }
togi-tool-modelcheck = { opt-level = 0 }
togi-tool-replay = { opt-level = 0 }
togi-tool-sim = { opt-level = 0 }
togi-tool-stats = { opt-level = 0 }
togi-tool-trialfacts = { opt-level = 0 }
togi-trial = { opt-level = 0 }
togi-ycruncher = { opt-level = 0 }

[profile.release]
lto = "thin"
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = "full"
