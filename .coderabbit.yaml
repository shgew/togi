# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: true
  slop_detection:
    enabled: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_usernames:
      - dependabot[bot]
  review_status: false
  path_filters:
    - "!go.sum"
    - "!flake.lock"
    - "!**/testdata/**"
  path_instructions:
    - path: internal/smu/**
      instructions: >-
        The only package that writes Curve Optimizer offsets. Every write is clamped to [-50, 0],
        preceded by an intent journal event and followed by a readback.
    - path: internal/tuner/**
      instructions: >-
        Pure decision engine: no I/O, clock or randomness except through injected seams.
    - path: docs/**
      instructions: >-
        Documentation often lands in the lowest layer of a stack of pull requests that merge
        together, ahead of the code in the layers above. Do not flag a statement only because this
        pull request does not implement it yet. Flag statements that are wrong, or that contradict
        the code or another document.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: Specs kept current
        mode: warning
        instructions: >-
          Warn only when the pull request changes a rule, boundary, event, state field, command or
          flag that docs/spec/ (tuner.md, workloads.md, journal.md, runtime.md) states, and the
          matching spec file does not change with it. Do not warn about diagnostic wording,
          message text, tests, the simulator or development tooling, or details the specs do not
          mention.
      - name: Breaking marked
        mode: warning
        instructions: >-
          If the pull request changes the value of `journal.Schema` or `tuner.Ruleset`, its title
          starts with `[BREAKING]`, it carries the `breaking` label, and its CHANGELOG.md line
          starts with `**BREAKING**`. Otherwise, none of these markers is present.
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    osvScanner:
      enabled: true
    github-checks:
      enabled: true
    golangci-lint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false
    vale:
      enabled: false
    trufflehog:
      enabled: false
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    ast-grep:
      enabled: false
    trivy:
      enabled: false
    presidio:
      enabled: false
chat:
  art: false
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTEXT.md
      - REVIEW.md
      - files: docs/spec/**
        applyTo: cmd/**,internal/**,nix/**
  learnings:
    scope: local
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: false
